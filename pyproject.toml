[project]
name = "afl-cloudedge-iot"
version = "0.1.0"
description = "Experimental evaluation of asynchronous federated learning"
dependencies = [
    "flwr[simulation]==1.39.0",
    "torch",
    "torchvision",
]

[tool.flwr.app]
publisher = "jsirisha"

[tool.flwr.app.components]
serverapp = "app.server_app:app"
clientapp = "app.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 1


